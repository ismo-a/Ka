<!doctype html>
<html lang="en">
<head>

  <title>FOUAD KA | Connect with us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1a0f2e; --surface:#2a1646; --surface-2:#341c58;
      --line:#4a2f75; --accent:#f4a6c0; --accent-deep:#d9779d;
      --text:#f8f1fb; --muted:#b9a8cc;
      --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
      --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0; min-height:100vh; min-height:100dvh;
      display:grid; place-items:center;
      padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 70% at 50% 0%, #3a2062 0%, transparent 60%),
        var(--ink);
      color:var(--text); font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
    }
    .card{
      width:min(100%,420px); padding:40px 22px 22px;
      border:1px solid var(--line); border-radius:24px;
      background:linear-gradient(180deg,#2a1646 0%,#21113a 100%);
      box-shadow:0 1px 0 #ffffff12 inset, 0 30px 70px -20px #000c;
      animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    .head{text-align:center;margin-bottom:30px}
    .logo{
      width:84px;height:84px;margin:0 auto 20px;border-radius:50%;
      display:grid;place-items:center;
      font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:2px;
      color:var(--accent);
      background:radial-gradient(circle at 30% 25%,#3a2062,#1d0e33);
      border:1px solid var(--accent-deep);
      box-shadow:0 0 0 6px #f4a6c022, 0 0 0 7px #f4a6c03a;
    }
    h1{
      margin:0;font-family:var(--serif);font-weight:600;
      font-size:40px;line-height:1;letter-spacing:.22em;padding-left:.22em;
    }
    .tag{margin:12px 0 0;color:var(--muted);font-size:14px;font-weight:400}
    .links{display:grid;gap:10px}
    .link{
      display:flex;align-items:center;gap:14px;
      padding:12px 14px;min-height:64px;
      border:1px solid var(--line);border-radius:16px;
      background:var(--surface);color:var(--text);text-decoration:none;
      transition:background .2s,border-color .2s;
    }
    .link:hover{background:var(--surface-2);border-color:var(--accent-deep)}
    .link:active{background:var(--surface-2)}
    .link:focus-visible,.save:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .ico{
      flex:none;width:40px;height:40px;border-radius:12px;
      display:grid;place-items:center;
      background:#f4a6c01f;color:var(--accent);
    }
    .ico svg{width:20px;height:20px}
    .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
    .name{font-size:15px;font-weight:600}
    .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chev{flex:none;width:16px;height:16px;color:var(--muted);transition:transform .2s,color .2s}
    .link:hover .chev{transform:translateX(3px);color:var(--accent)}
    .save{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;margin-top:16px;min-height:54px;padding:14px 18px;
      border:0;border-radius:16px;cursor:pointer;
      background:linear-gradient(180deg,#ffd9a0,#f0b86e);color:#2a1646;
      font:600 15px var(--sans);text-decoration:none;
      transition:filter .2s;
    }
    .save:hover{filter:brightness(1.06)}
    .save svg{width:18px;height:18px}
    .foot{margin:22px 0 0;text-align:center;color:#8f7aa8;font-size:12px}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){
      .card{animation:none}
      .link,.chev,.save{transition:none}
    }
    @media (max-width:360px){
      .card{padding:34px 16px 18px}
      h1{font-size:34px}
    }
  </style>
</head>
<body>

      <a class="link" id="tel" href="tel:+212626188756">

  <script>

</html>
